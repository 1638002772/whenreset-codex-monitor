<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1917">
  <title>邮件订阅确认 · WHENRESET</title>
  <script src="site-config.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; background: #0c1917; color: #eff8f3; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { min-height: 100vh; width: 100%; margin: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #1a443a 0, #0c1917 58%); }
    main { width: min(calc(100vw - 48px), 520px); max-width: 520px; min-width: 0; padding: clamp(26px, 6vw, 42px); border: 1px solid #34534a; border-radius: 22px; background: rgba(17, 35, 31, .94); box-shadow: 0 28px 90px #0006; }
    .brand { color: #75d8b2; font-size: 12px; font-weight: 750; letter-spacing: .22em; }
    .eyebrow { margin: 34px 0 10px; color: #91a99f; font-size: 13px; }
    h1 { margin: 0; font-size: clamp(25px, 6vw, 34px); letter-spacing: -.04em; }
    p { color: #afc2ba; line-height: 1.75; }
    button, .back { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; margin-top: 16px; padding: 0 20px; border: 0; border-radius: 10px; background: #45d0a0; color: #092019; font: inherit; font-weight: 750; text-decoration: none; cursor: pointer; }
    button:disabled { cursor: wait; opacity: .7; }
    .back { margin-left: 8px; border: 1px solid #456359; background: transparent; color: #d4e4dc; }
    .notice { min-height: 26px; margin: 18px 0 0; color: #d3e4dc; font-size: 14px; }
    .foot { margin-top: 30px; padding-top: 18px; border-top: 1px solid #29443c; color: #81988e; font-size: 12px; }
    @media (max-width: 430px) { .brand { font-size: 11px; letter-spacing: .16em; } .back { margin-left: 0; } .actions { display: grid; gap: 2px; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">WHENRESET <span aria-hidden="true">·</span> CODEX USAGE WATCH</div>
    <p class="eyebrow" id="eyebrow">邮件订阅</p>
    <h1 id="title">正在读取确认链接</h1>
    <p id="description">请稍候。</p>
    <div class="actions">
      <button id="action" type="button" hidden></button>
      <a class="back" href="./">返回 WHENRESET</a>
    </div>
    <p class="notice" id="notice" role="status" aria-live="polite"></p>
    <div class="foot">只有点击上方按钮后，才会提交确认或退订请求。</div>
  </main>
  <script>
    const apiBase = String(window.WHENRESET_EMAIL_API_BASE || '').replace(/\/$/, '');
    const params = new URLSearchParams(location.hash.slice(1));
    const verificationToken = params.get('verify') || '';
    const subscriberId = params.get('unsubscribe') || '';
    const unsubscribeToken = params.get('token') || '';
    history.replaceState(null, '', location.pathname + location.search);

    const title = document.querySelector('#title');
    const eyebrow = document.querySelector('#eyebrow');
    const description = document.querySelector('#description');
    const notice = document.querySelector('#notice');
    const button = document.querySelector('#action');
    const mode = verificationToken ? 'verify' : subscriberId && unsubscribeToken ? 'unsubscribe' : '';

    if (!apiBase || !mode) {
      title.textContent = '确认链接不可用';
      description.textContent = '链接缺少有效信息或已失效。请回到网站重新提交邮箱，获取新的确认邮件。';
    } else {
      eyebrow.textContent = mode === 'verify' ? '确认邮件订阅' : '管理邮件订阅';
      title.textContent = mode === 'verify' ? '确认订阅 WHENRESET' : '取消邮件订阅';
      description.textContent = mode === 'verify'
        ? '确认后，当 Tibo 的公开帖子明确预告或确认 Codex 使用额度重置时，我们会发送邮件提醒。'
        : '确认后，此邮箱将不再收到 WHENRESET 的重置提醒。';
      button.hidden = false;
      button.textContent = mode === 'verify' ? '确认订阅' : '确认取消订阅';
      button.addEventListener('click', async () => {
        button.disabled = true;
        button.textContent = '正在处理…';
        notice.textContent = '';
        try {
          const isVerify = mode === 'verify';
          const response = await fetch(`${apiBase}/api/${isVerify ? 'verify' : 'unsubscribe'}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(isVerify
              ? { token: verificationToken }
              : { id: subscriberId, token: unsubscribeToken }),
            cache: 'no-store',
          });
          const result = await response.json();
          if ((mode === 'verify' && response.status === 410) || (mode === 'unsubscribe' && response.status === 400)) {
            title.textContent = mode === 'verify' ? '确认链接已使用或已过期' : '退订链接无效';
            description.textContent = mode === 'verify'
              ? '如果此前页面显示“订阅已确认”，你的订阅已经生效，无需重新操作；否则请返回网站重新提交邮箱，获取新链接。'
              : '请从最新的 WHENRESET 邮件重新打开退订链接。';
            button.hidden = true;
            notice.textContent = '';
            return;
          }
          if (!response.ok || !result.ok) throw new Error('邮件服务暂时不可用，请稍后重试。');
          title.textContent = isVerify ? '订阅已确认' : '已取消订阅';
          description.textContent = isVerify
            ? '设置完成。发现明确的 Codex 重置预告或到账确认时，我们会发送邮件提醒。'
            : '此邮箱将不再收到 WHENRESET 邮件。';
          button.hidden = true;
          notice.textContent = '';
        } catch (error) {
          notice.textContent = error instanceof TypeError
            ? '连接邮件服务失败，请检查网络后重试。'
            : error instanceof Error ? error.message : '请求未能完成，请稍后重试。';
          button.disabled = false;
          button.textContent = mode === 'verify' ? '重试确认' : '重试退订';
        }
      });
    }
  </script>
</body>
</html>
