name: Monitor public X posts and publish Pages

on:
  schedule:
    # Run every 10 minutes, offset from the busiest top-of-hour minute.
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: whenreset-pages
  cancel-in-progress: false

jobs:
  monitor-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WHENRESET_FEISHU_WEBHOOK: ${{ secrets.WHENRESET_FEISHU_WEBHOOK }}
      WHENRESET_FEISHU_SECRET: ${{ secrets.WHENRESET_FEISHU_SECRET }}
      WHENRESET_EMAIL_API_URL: ${{ secrets.WHENRESET_EMAIL_API_URL }}
      WHENRESET_EMAIL_API_TOKEN: ${{ secrets.WHENRESET_EMAIL_API_TOKEN }}
      WHENRESET_SMTP_HOST: smtp.qq.com
      WHENRESET_SMTP_PORT: "465"
      WHENRESET_SMTP_USER: ${{ secrets.WHENRESET_SMTP_USER }}
      WHENRESET_SMTP_PASSWORD: ${{ secrets.WHENRESET_SMTP_PASSWORD }}
      WHENRESET_SMTP_FROM: ${{ secrets.WHENRESET_SMTP_FROM }}
      WHENRESET_SMTP_SECURITY: ssl
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new public posts
        id: scrape
        continue-on-error: true
        run: python monitor.py --once

      - name: Build static data and site
        run: python tools/build_site.py

      - name: Save monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/state.json data/posts.json data/events.json
          if git diff --cached --quiet; then
            echo "No monitor state changes to save."
          else
            git commit -m "Update public reset monitor data"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Report scrape failure after publishing status
        if: steps.scrape.outcome == 'failure'
        run: exit 1
