name = "whenreset-codex-monitor"
main = "worker.js"
compatibility_date = "2026-10-08"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "whenreset-codex-monitor"
database_id = "REPLACE_AFTER_D1_CREATE"
migrations_dir = "./migrations"
